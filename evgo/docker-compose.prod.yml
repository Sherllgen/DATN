version: "3.8"

services:
  # =====================
  # Redis Cache (Docker)
  # =====================
  redis:
    image: redis:7-alpine
    container_name: evgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evgo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================
  # Backend API (Database = Supabase, Cache = Redis in Docker)
  # =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evgo-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Redis (in-container)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # DB -> Supabase (read from .env: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)
    networks:
      - evgo-network

volumes:
  redis_data:
    driver: local

networks:
  evgo-network:
    driver: bridge
